<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>grovewatch — provenance viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The viewer resolves its report in this order:
        1. ?report=<url> query parameter
        2. this inline #gw-report block (lets the page work from file://)
        3. ./provenance.json fetched relative to the page

      The inline block below is the bundled sample report generated by:
        grovewatch scan -out examples/report/provenance.json examples/sample-workspace
      Regenerate it and re-embed with: make viewer-embed
    -->
    <script id="gw-report" type="application/json">
{
  "schema": "1.0.0",
  "tool": { "name": "grovewatch", "version": "0.1.0" },
