<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img"
     aria-labelledby="pt-title pt-desc" font-family="'Segoe UI',system-ui,sans-serif">
  <title id="pt-title">grovewatch provenance tree</title>
  <desc id="pt-desc">A ranger's field-guide tree: roots are file, tool and environment
  inputs; the trunk is the deterministic digest build; the canopy is the emitted
  provenance snapshot. Signal pulses travel up the paths from roots to canopy.</desc>

  <defs>
    <linearGradient id="pt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04140d"/>
      <stop offset="0.55" stop-color="#06231a"/>
      <stop offset="1" stop-color="#03170f"/>
    </linearGradient>
    <linearGradient id="pt-trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6b4a25"/>
      <stop offset="1" stop-color="#a9772f"/>
    </linearGradient>
    <radialGradient id="pt-canopy" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3fbf7f"/>
      <stop offset="0.6" stop-color="#1f8f5a"/>
      <stop offset="1" stop-color="#0c5f39"/>
    </radialGradient>
    <radialGradient id="pt-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <filter id="pt-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="url(#pt-sky)"/>

  <!-- faint moss ground line -->
  <path d="M0 372 H880" stroke="#0e3a26" stroke-width="2" opacity="0.7"/>
  <ellipse cx="440" cy="372" rx="250" ry="16" fill="#0b3120" opacity="0.55"/>

  <!-- ===== ROOTS (inputs) ===== -->
  <g stroke-linecap="round" fill="none">
    <!-- files root -->
    <path id="pt-r1" d="M440 372 C 360 400, 250 402, 170 420" stroke="#7c5a2c" stroke-width="7" opacity="0.85"/>
    <!-- tools root -->
    <path id="pt-r2" d="M440 372 C 440 404, 440 412, 440 428" stroke="#7c5a2c" stroke-width="7" opacity="0.85"/>
    <!-- env root -->
    <path id="pt-r3" d="M440 372 C 520 400, 630 402, 712 420" stroke="#7c5a2c" stroke-width="7" opacity="0.85"/>
  </g>

  <!-- pulsing signals rising along each root into the trunk -->
  <g fill="#f5c451">
    <circle r="4">
      <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"
        path="M440 372 C 360 400, 250 402, 170 420"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion dur="3.2s" begin="0.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"
        path="M440 372 C 440 404, 440 412, 440 428"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion dur="3.2s" begin="1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"
        path="M440 372 C 520 400, 630 402, 712 420"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- root labels -->
  <g font-size="12" fill="#bfe7cf" text-anchor="middle">
    <text x="150" y="440">files → sha-256</text>
    <text x="440" y="452">tools on PATH</text>
    <text x="726" y="440">env → hashed</text>
  </g>

  <!-- ===== TRUNK (deterministic build) ===== -->
  <path d="M418 372 C 424 300, 424 250, 430 200 L 450 200 C 456 250, 456 300, 462 372 Z"
        fill="url(#pt-trunk)"/>
  <!-- rising digest pulse in the trunk -->
  <circle r="5" fill="#ffe08a" filter="url(#pt-soft)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M440 366 L 440 202"/>
    <animate attributeName="opacity" values="0;1;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g font-size="11" fill="#f0d9a0" text-anchor="middle" letter-spacing="1">
    <text x="440" y="300" transform="rotate(-90 440 300)">canonical digest · merkle root</text>
  </g>

  <!-- ===== CANOPY (artifacts) ===== -->
  <g>
    <circle cx="440" cy="150" r="120" fill="url(#pt-canopy)"/>
    <circle cx="330" cy="185" r="72" fill="url(#pt-canopy)" opacity="0.92"/>
    <circle cx="552" cy="185" r="72" fill="url(#pt-canopy)" opacity="0.92"/>
    <circle cx="390" cy="95" r="60" fill="url(#pt-canopy)" opacity="0.9"/>
    <circle cx="500" cy="100" r="58" fill="url(#pt-canopy)" opacity="0.9"/>
    <!-- breathing canopy -->
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1.015 1.02;1 1" dur="6s" repeatCount="indefinite"/>
  </g>

