<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img"
     aria-labelledby="tp-title tp-desc" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,monospace">
  <title id="tp-title">grovewatch drift terminal panorama</title>
  <desc id="tp-desc">A terminal panorama: a scan produces a snapshot, verify confirms
  the digest, and diff prints an animated drift report (added, modified and removed
  entries typed line by line) while a small canopy of leaf artifacts sits alongside.</desc>

  <defs>
    <linearGradient id="tp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052018"/>
      <stop offset="1" stop-color="#03120c"/>
    </linearGradient>
    <linearGradient id="tp-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3626"/>
      <stop offset="1" stop-color="#0a2a1d"/>
    </linearGradient>
    <clipPath id="tp-screen"><rect x="24" y="60" width="832" height="330" rx="8"/></clipPath>
  </defs>

  <rect width="880" height="420" fill="url(#tp-bg)"/>

  <!-- window frame -->
  <rect x="24" y="24" width="832" height="366" rx="12" fill="#06231a" stroke="#12513a" stroke-width="1.5"/>
  <rect x="24" y="24" width="832" height="36" rx="12" fill="url(#tp-bar)"/>
  <g>
    <circle cx="48" cy="42" r="6" fill="#e5695f"/>
    <circle cx="70" cy="42" r="6" fill="#f5c451"/>
    <circle cx="92" cy="42" r="6" fill="#3fbf7f"/>
  </g>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#7fc9a3">grovewatch · provenance viewer · drift panorama</text>

  <!-- screen -->
  <rect x="24" y="60" width="832" height="330" fill="#04180f"/>

  <g clip-path="url(#tp-screen)" font-size="14.5">
    <!-- prompt: scan -->
    <text x="44" y="92" fill="#5fe0a0">
      <tspan fill="#f0c968">ranger@grove</tspan> $ grovewatch scan -out new.json workspace
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="44" y="116" fill="#9fe8c4" opacity="0">
      wrote new.json (5 files, digest 2990f2bef8e0)
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze"/>
    </text>

    <!-- prompt: verify -->
    <text x="44" y="148" fill="#5fe0a0" opacity="0">
      <tspan fill="#f0c968">ranger@grove</tspan> $ grovewatch verify examples/report/provenance.json
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="44" y="172" fill="#3fbf7f" opacity="0">
      OK: digest b8afd4eb68c2 matches content
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.3s" fill="freeze"/>
    </text>

    <!-- prompt: diff -->
    <text x="44" y="204" fill="#5fe0a0" opacity="0">
      <tspan fill="#f0c968">ranger@grove</tspan> $ grovewatch diff provenance.json new.json
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.0s" fill="freeze"/>
    </text>
    <text x="44" y="228" fill="#f5c451" opacity="0">
      Drift detected: 1 added, 1 modified, 1 removed.
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.6s" fill="freeze"/>
    </text>
    <text x="44" y="250" fill="#7fc9a3" opacity="0">
      old b8afd4eb68c2 -&gt; new 2990f2bef8e0
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.0s" fill="freeze"/>
    </text>
    <text x="44" y="274" fill="#e5695f" opacity="0">
      [file/removed] config.json: file removed (was 131 bytes)
